<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealFlow360 - Self Governing B2B Sales Operations Platform</title>
    
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN Engine & Custom Theme Configuration (DESIGN.md tokens) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#000000',
              'on-primary': '#ffffff',
              ink: '#000000',
              charcoal: '#000000',
              body: '#5e5e5e',
              muted: '#5e5e5e',
              mute: '#afafaf',
              'hairline-mid': '#4b4b4b',
              canvas: '#ffffff',
              cream: '#ffffff', // Maps cream to pure canvas white
              'canvas-soft': '#efefef',
              'canvas-softer': '#f3f3f3',
              'surface-pressed': '#e2e2e2',
              'warm-border': '#e2e2e2',
              'charcoal-03': '#f3f3f3',
              'charcoal-04': '#efefef',
              'black-elevated': '#282828',
            },
            borderRadius: {
              xl: '16px',
              pill: '999px',
              'pill-tab': '36px',
            },
            fontFamily: {
              sans: ['Roboto', 'UberMoveText', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
              heading: ['Roboto', 'UberMove', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-cream text-charcoal font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
